<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrustFund logo">
  <defs>
    <linearGradient id="tfShield" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0EA5A4"/>
    </linearGradient>
    <linearGradient id="tfCycle" x1="120" y1="150" x2="392" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <marker id="tfArrow" viewBox="0 0 10 10" refX="2" refY="5"
            markerWidth="3" markerHeight="3" orient="auto-start-reverse"
            markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#E6FFFA"/>
    </marker>
  </defs>

  <!-- Shield -->
  <path d="M256 16 L480 92 V268 C480 404 380 480 256 500 C132 480 32 404 32 268 V92 Z"
        fill="url(#tfShield)"/>

  <!-- Inner shield rim -->
  <path d="M256 56 L440 118 V268 C440 384 356 452 256 470 C156 452 72 384 72 268 V118 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Lend & recover cycle: thin curved arrows forming an outer loop -->
  <g stroke="url(#tfCycle)" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M152 204 A120 120 0 0 1 344 182" marker-end="url(#tfArrow)"/>
    <path d="M360 328 A120 120 0 0 1 168 350" marker-end="url(#tfArrow)"/>
  </g>

  <!-- Rupee: Lucide "indian-rupee" glyph (24x24), scaled ~6.1x and centered,
       nudged slightly right. Stroke width 2 * 6.1 ~= 12. -->
  <g transform="translate(192 200) scale(6.1)"
     fill="none" stroke="#ffffff" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h12"/>
    <path d="M6 8h12"/>
    <path d="M6 13l8.5 8"/>
    <path d="M6 13h3"/>
    <path d="M9 13c6.667 0 6.667-10 0-10"/>
  </g>
</svg>
